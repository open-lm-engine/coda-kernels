[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "coda-kernels"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "torch",
    "nvidia-cutlass-dsl>=4.7",
    "quack-kernels @ git+https://github.com/HanGuo97/quack.git@a51cd8c8a24f78e16be1ca1edbfe8a8be225257e",
    "apache-tvm-ffi",
    "torch-c-dlpack-ext",
    "einops",
    "fla-core>=0.5.0",
    "packaging",
    "ipdb",
]

[tool.setuptools.dynamic]
version = { attr = "coda.__version__" }

[tool.setuptools.packages.find]
include = ["coda*"]
